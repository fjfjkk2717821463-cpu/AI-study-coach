<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DFL Coach</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e3e6ea;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --user-bubble: #eef2ff;
      --assistant-bubble: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .app { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }
    header { margin-bottom: 22px; }
    h1 { font-size: 28px; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .common-row { margin-bottom: 10px; }
    .common-row label { margin-top: 0; }
    .tabs button {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
    .tabs button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
    }
    textarea { min-height: 130px; resize: vertical; }
    .hidden { display: none !important; }
    button.primary {
      margin-top: 18px;
      padding: 11px 18px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #b91c1c; margin-top: 12px; font-size: 14px; }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

    #chatSection { display: flex; flex-direction: column; }
    #messages { min-height: 320px; max-height: 62vh; overflow-y: auto; padding: 6px 2px; }
    .msg { margin-bottom: 18px; }
    .msg .role {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .msg .bubble {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      overflow-wrap: anywhere;
    }
    .msg.user .bubble { background: var(--user-bubble); border-color: #dfe5ff; }
    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
    }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    .bubble p code, .bubble li code {
      background: #eef1f5;
      padding: 1px 5px;
      border-radius: 5px;
    }
    .bubble blockquote {
      border-left: 3px solid var(--accent);
      margin: 0;
      padding: 4px 12px;
      color: var(--muted);
      background: #f8f9fb;
      border-radius: 0 8px 8px 0;
    }
    .bubble table { border-collapse: collapse; width: 100%; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; }
    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 6px;
    }
    .composer textarea { flex: 1; min-height: 52px; max-height: 180px; }
    .composer button { padding: 10px 18px; white-space: nowrap; }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    .actions button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .summary-note {
      background: #fff7ed;
      border-color: #fed7aa;
    }
    .header-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .header-actions button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .back-row { margin-bottom: 16px; }
    .back-row button {
      padding: 7px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .book-group { margin-bottom: 22px; }
    .book-group h3 { margin: 0 0 10px; }
    .summary-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .summary-item summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 600;
      list-style: none;
    }
    .summary-item summary::-webkit-details-marker { display: none; }
    .summary-item .summary-body { padding: 0 12px 12px; }
    .shelf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .shelf-row .shelf-name { font-weight: 600; word-break: break-all; }
    .shelf-row .shelf-path { color: var(--muted); font-size: 12px; word-break: break-all; }
    .shelf-row button {
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      color: #b91c1c;
    }
    .add-book { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; }
    .web-import { margin-top: 0; border-top: 0; padding-top: 0; }
    .empty-hint { color: var(--muted); font-size: 14px; }
    .chapter-wrap { position: relative; }
    .chapter-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      z-index: 20;
      padding: 4px;
    }
    .chapter-menu .cm-item {
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      word-break: break-all;
    }
    .chapter-menu .cm-item:hover, .chapter-menu .cm-item.selected { background: #eef2ff; }
    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fff;
    }
    .session-row .s-info { min-width: 0; flex: 1; }
    .session-row .s-subject { font-weight: 600; word-break: break-all; }
    .session-row .s-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .session-row .s-actions { display: flex; gap: 6px; flex: none; }
    .session-row .s-actions button {
      padding: 6px 10px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .session-row .s-actions .danger { color: #b91c1c; }
    .regenerate-btn {
      margin-top: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
    }
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-card {
      width: min(460px, 92vw);
      max-height: 86vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 14px;
      padding: 24px;
    }
    .modal-card h2 { margin: 0 0 14px; font-size: 20px; }
    .modal-card label { display: block; font-size: 14px; margin: 12px 0 5px; }
    .modal-card input, .modal-card select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 9px; cursor: pointer; font-size: 14px; border: 1px solid var(--border); background: #fff; }
    .modal-actions .primary { background: var(--accent); color: #fff; border: 0; }
    .settings-hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
    @media (max-width: 640px) {
      .app { padding: 16px 10px 40px; }
      h1 { font-size: 24px; }
      .card { padding: 16px; }
      .header-actions { gap: 8px; }
      .header-actions button { flex: 1 1 auto; font-size: 13px; padding: 8px 6px; }
      input, select, textarea { font-size: 16px; }
      .composer { flex-direction: column; align-items: stretch; }
      .composer textarea { min-height: 48px; }
      .composer button { width: 100%; }
      .actions { flex-wrap: wrap; }
      .actions button { flex: 1 1 auto; }
      .shelf-row { flex-direction: column; align-items: stretch; }
      .shelf-row button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📚 DFL Coach</h1>
      <p class="sub">先带你准确学懂一个概念，再用费曼式复述、反例和默写重构来检测巩固，而不是只「看懂了」。</p>
      <div class="header-actions">
        <button id="historyBtn" type="button">🕘 继续上次学习</button>
        <button id="reviewBtn" type="button">📚 复习所有总结</button>
        <button id="shelfBtn" type="button">📖 管理书架</button>
        <button id="settingsBtn" type="button">⚙️ 模型设置</button>
      </div>
    </header>

    <section id="setup" class="card">
      <div class="tabs">
        <button id="bookTab" class="active" type="button">电子书模式</button>
        <button id="outlineTab" type="button">目录速建模式</button>
      </div>

      <div class="common-row">
        <label for="explainLevel">讲解强度</label>
        <select id="explainLevel">
          <option value="high" selected>多讲解（先教再问）</option>
          <option value="medium">适中（讲解与追问并重）</option>
          <option value="low">少讲解（以追问为主）</option>
        </select>
      </div>

      <div id="bookSetup">
        <label for="bookSelect">选择书架上的书籍</label>
        <select id="bookSelect"></select>
        <label for="chapterSelect">选择章节</label>
        <select id="chapterSelect"></select>
        <label for="chapterLevel">章节层级</label>
        <select id="chapterLevel">
          <option value="auto" selected>自动（推荐）</option>
          <option value="chapter">大章节</option>
          <option value="section">小章节</option>
        </select>
        <label for="chapterQuery">或输入章节关键词</label>
        <div class="chapter-wrap">
          <input id="chapterQuery" placeholder="搜索章节，例如：第四章 / 熵 / 4">
          <div id="chapterMenu" class="chapter-menu hidden"></div>
        </div>
        <p class="hint">还没有书籍？点击上方「📖 管理书架」，直接导入 .txt / .md / .pdf / .epub 或网页链接。</p>
      </div>

      <div id="outlineSetup" class="hidden">
        <label for="outlineTitle">学习主题 / 章节标题</label>
        <input id="outlineTitle" placeholder="例如：热力学第二定律">
        <label for="outlineContent">章节目录或内容要点</label>
        <textarea id="outlineContent" placeholder="粘贴目录、大纲或你要掌握的知识点"></textarea>
      </div>

      <button id="startBtn" class="primary" type="button">开始学习</button>
      <p id="setupError" class="error"></p>
    </section>

    <section id="bookshelfSection" class="card hidden">
      <div class="back-row">
        <button id="bookshelfBackBtn" type="button">← 返回开始学习</button>
      </div>
      <h2>📖 管理书架</h2>
      <p class="hint">直接导入 .txt、.md、.pdf 或 .epub 书籍，文件会复制到本机数据目录中。</p>
      <div id="shelfList"></div>
      <div class="add-book">
        <label for="bookFileInput">选择书籍文件</label>
        <input id="bookFileInput" type="file" accept=".txt,.md,.pdf,.epub">
        <label for="bookNameInput">书籍名称（可选）</label>
        <input id="bookNameInput" placeholder="留空则使用文件名">
        <button id="addBookBtn" class="primary" type="button">添加到书架</button>
      </div>
      <div class="add-book web-import">
        <label for="webUrlInput">或从网页导入</label>
        <input id="webUrlInput" placeholder="https://example.com/article">
        <input id="webNameInput" placeholder="名称（可选，默认使用网页标题）">
        <button id="importWebBtn" class="primary" type="button">导入网页</button>
      </div>
      <p id="shelfError" class="error"></p>
    </section>

    <section id="historySection" class="card hidden">
      <div class="back-row">
        <button id="historyBackBtn" type="button">← 返回开始学习</button>
      </div>
      <h2>🕘 继续上次学习</h2>
      <p class="hint">搜索、继续、重命名或删除之前保存的会话。</p>
      <input id="sessionSearch" placeholder="🔍 搜索会话标题……">
      <div id="sessionList"></div>
      <p id="historyError" class="error"></p>
    </section>

    <section id="reviewSection" class="card hidden">
      <div class="back-row">
        <button id="reviewBackBtn" type="button">← 返回开始学习</button>
      </div>
      <h2>📚 学习总结复习中心</h2>
      <div id="reviewContent"></div>
    </section>

    <section id="chatSection" class="card hidden">
      <div id="messages"></div>
      <div class="composer">
        <textarea id="messageInput" placeholder="输入你的理解，教练会追问、给反例、检查逻辑……"></textarea>
        <button id="sendBtn" class="primary" type="button">发送</button>
      </div>
      <div class="actions">
        <button id="summaryBtn" type="button">生成总结</button>
        <button id="endBtn" type="button">结束并保存会话</button>
      </div>
    </section>

    <div id="settingsModal" class="modal hidden">
      <div class="modal-card">
        <h2>⚙️ 模型与 API 设置</h2>
        <label for="providerSelect">服务商</label>
        <select id="providerSelect"></select>
        <label for="baseUrlInput">接口地址（OpenAI 兼容）</label>
        <input id="baseUrlInput" placeholder="https://api.example.com/v1/chat/completions">
        <label for="modelInput">模型名称</label>
        <input id="modelInput" placeholder="例如：deepseek-chat / gpt-4o-mini">
        <label for="modelKeyInput">API Key（留空则继续使用已保存的密钥）</label>
        <input id="modelKeyInput" type="password" placeholder="sk-...">
        <p id="settingsHint" class="settings-hint"></p>
        <div class="modal-actions">
          <button id="closeSettingsBtn" type="button">取消</button>
          <button id="saveSettingsBtn" class="primary" type="button">保存</button>
        </div>
        <p id="settingsError" class="error"></p>
      </div>
    </div>
  </div>

<script src="/static/app.js"></script>
</body>
</html>
